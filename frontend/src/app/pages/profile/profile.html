<div class="min-h-screen flex flex-col bg-gray-100">
    
      <nav class="bg-sky-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex-shrink-0 font-bold text-2xl tracking-wider cursor-pointer" routerLink="/home">
                    Bau<span class="text-yellow-500">Flights</span>
                </div>

                <div class="flex items-center space-x-6">
                    <ng-container *ngIf="!this.http.isAuthenticated()">
                        <a routerLink="/login" class="hover:text-yellow-500 transition-colors"> login</a>
                    </ng-container>
                    
                    <ng-container *ngIf="this.http.isAuthenticated() && this.http.is_passenger()">
                        <a routerLink="/bookingPrenotation" class="hover:text-yellow-500 transition-colors"> Prenotazioni</a>
                    </ng-container>

                    <ng-container *ngIf="this.http.isAuthenticated()">
                        <a routerLink="/profile" class="hover:text-yellow-500 transition-colors"> Profilo</a>
                        <a (click)="this.http.logout()" class="hover:text-yellow-500 transition-colors"> logout</a>
                    </ng-container>
                </div>
            </div>
        </div>
    </nav>

    <div class="flex-grow flex flex-col lg:flex-row gap-6 bg-sky-400 items-start justify-center p-4 md:p-8">
        
        <div class="flex-1">
            <div class="bg-white shadow-lg rounded-md p-6 border-yellow-500 border-l-4">
                <div class="flex flex-row items-center justify-center mb-3 bg-sky-400 p-2 rounded-md shadow-sm">
                    <span class="text-lg text-sky-800 font-bold tracking-wider">Informazioni del profilo</span>
                </div>
                
                <form [formGroup]="newdata" (ngSubmit)="onclickChangeData()" class="w-full">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Email</label>
                            <div class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300">
                                {{ this.http.get_email() }}
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Old Password</label>
                            <input type="password" formControlName="oldPassword" placeholder="Es. ********" 
                                class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                        </div>

                         <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">New Password</label>
                            <input type="password" formControlName="newPassword" placeholder="Es. ********" 
                                class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Ruolo</label>
                             <div class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300">
                                {{ this.http.get_role() }}
                            </div>
                        </div>


                        <ng-container *ngIf="this.http.isAuthenticated() && this.http.is_passenger()">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Nome</label>
                                <input type="text" formControlName="name" placeholder="Es. Mario" 
                                    class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Cognome</label>
                                <input type="text" formControlName="surname" placeholder="Es. Rossi" 
                                    class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Data di nascita</label>
                                <input type="date" formControlName="birthdate" placeholder="Es. 01/01/2000" 
                                    class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                            </div>

                             <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Phone Number</label>
                                <input type="text" formControlName="phonenumber" placeholder="Es. 1234567890" 
                                    class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Indirizzo di pagamento</label>
                                <input type="text" formControlName="paymentAddress" placeholder="Es. Mario" 
                                    class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                            </div>

                        </ng-container>
                       

                        <ng-container *ngIf="this.http.isAuthenticated() && this.http.is_airline()">
                                <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Nome Compagnia</label>
                                <input type="text" formControlName="company" placeholder="Es. Mario" 
                                    class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                            </div>
                        </ng-container>
                    </div>
                    
                    <div class="flex justify-end">
                        <button type="submit" [disabled]="newdata.invalid"
                            class="px-6 py-3 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-md shadow-md transition-all disabled:opacity-50">
                            Modifica Informazioni
                        </button>
                    </div>
                    
                    <!-- MESSAGGI PER CREAZIONE -->
                    <div *ngIf="errorMessage" class="mt-4">
                        <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded shadow-sm flex items-center justify-between">
                            <span class="text-red-800 text-sm font-medium">{{ errorMessage }}</span>
                            <button type="button" (click)="errorMessage = null" class="text-red-500 hover:text-red-700 text-xl font-bold">
                                &times;
                            </button>
                        </div>
                    </div>
                    
                    <div *ngIf="successMessage" class="mt-4">
                        <div class="bg-green-50 border-l-4 border-green-500 p-4 rounded shadow-sm">
                            <span class="text-green-800 text-sm font-medium">{{ successMessage }}</span>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
