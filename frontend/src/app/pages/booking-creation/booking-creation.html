<div class="min-h-screen flex flex-col bg-gray-100">
    
    <nav class="bg-sky-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex-shrink-0 font-bold text-2xl tracking-wider cursor-pointer" routerLink="/home">
                    Bau<span class="text-yellow-500">Flights</span>
                </div>

                <div class="flex items-center space-x-6 font-medium">
                    <ng-container *ngIf="isLoggedIn">
                        <a routerLink="/profile" class="hover:text-yellow-500 transition-colors cursor-pointer">Profilo</a>
                    </ng-container>

                    <ng-container *ngIf="!isLoggedIn">
                        <a routerLink="/login" class="hover:text-yellow-500 transition-colors cursor-pointer">Accedi</a>
                    </ng-container>

                    <a routerLink="/cart" class="hover:text-yellow-500 transition-colors cursor-pointer">Carrello</a>
                </div>
            </div>
        </div>
    </nav>


    <div class="flex flex-col grow bg-sky-400 items-center justify-center p-8 space-y-10">
          
        <h2 class="text-2xl font-bold text-gray-800 mb-6">
           Completa la prenotazione!
        </h2>

        <form [formGroup]="bookingForm" (ngSubmit)="onSubmit()" *ngIf="firstFlight && bookingForm">
            <div class="bg-white shadow-lg border border-solid border-yellow-500 border-l-4 rounded-md p-4 mb-6" formGroupName="firstFlight">
                <div class="flex flex-row items-center p-4 gap-4">
                    <span class="bg-sky-300 rounded-md w-fit text-md text-sky-600 font-bold px-2 py-0.5 uppercase">Tratta1</span>   
                    <div class="text-sky-600 text-xl font-bold py-1 rounded">
                            Da: <span>{{ firstFlight.from }}</span> a <span>{{ firstFlight.route.arrivalAirport.city }}</span>
                    </div>
                </div>
            </div>
        </form>

    </div>
</div>
