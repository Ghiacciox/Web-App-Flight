<div class="min-h-screen flex flex-col bg-gray-100">
    
      <nav class="bg-sky-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex-shrink-0 font-bold text-2xl tracking-wider cursor-pointer" routerLink="/home">
                    Bau<span class="text-yellow-500">Flights</span>
                </div>

                <div class="flex items-center space-x-6">
                    <ng-container *ngIf="!this.http.isAuthenticated()">
                        <a routerLink="/login" class="hover:text-yellow-500 transition-colors"> login</a>
                    </ng-container>
                    
                    <ng-container *ngIf="this.http.isAuthenticated() && this.http.is_passenger()">
                        <a routerLink="/bookingPrenotation" class="hover:text-yellow-500 transition-colors"> Prenotazioni</a>
                    </ng-container>

                    <ng-container *ngIf="this.http.isAuthenticated()">
                        <a routerLink="/profile" class="hover:text-yellow-500 transition-colors"> Profilo</a>
                        <a (click)="this.http.logout()" class="hover:text-yellow-500 transition-colors"> logout</a>
                    </ng-container>
                </div>
            </div>
        </div>
    </nav>

    <div class="flex-grow flex flex-col lg:flex-row gap-6 bg-sky-400 items-start justify-center p-4 md:p-8">
        
        <div class="flex-1">
            <div class="bg-white shadow-lg rounded-md p-6 border-yellow-500 border-l-4">
                <div class="flex flex-row items-center justify-center mb-3 bg-sky-400 p-2 rounded-md shadow-sm">
                    <span class="text-lg text-sky-800 font-bold tracking-wider">Tool Creazione Aeroporti</span>
                </div>
                
                <form [formGroup]="newAirportForm" (ngSubmit)="onclickCreateAirport()" class="w-full">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Codice Aeroporto</label>
                            <input type="text" formControlName="code" placeholder="Es. MIL" 
                                class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Nome Aeroporto</label>
                            <input type="text" formControlName="name" placeholder="Es. Malpensa" 
                                class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Città</label>
                            <input type="text" formControlName="city" placeholder="Es. Milano" 
                                class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Paese</label>
                            <input type="text" formControlName="country" placeholder="Es. Italia" 
                                class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                        </div>
                    </div>
                    
                    <div class="flex justify-end">
                        <button type="submit" [disabled]="newAirportForm.invalid"
                            class="w-full px-6 py-3 bg-yellow-500 hover:bg-yellow-600 text-white font-bold rounded-md shadow-md transition-all disabled:opacity-50 text-base whitespace-nowrap">
                            Crea Aeroporto
                        </button>
                    </div>
                    
                    <!-- MESSAGGI PER CREAZIONE -->
                    <div *ngIf="errorMessage" class="mt-4">
                        <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded shadow-sm flex items-center justify-between">
                            <span class="text-red-800 text-sm font-medium">{{ errorMessage }}</span>
                            <button type="button" (click)="errorMessage = null" class="text-red-500 hover:text-red-700 text-xl font-bold">
                                &times;
                            </button>
                        </div>
                    </div>
                    
                    <div *ngIf="successMessage" class="mt-4">
                        <div class="bg-green-50 border-l-4 border-green-500 p-4 rounded shadow-sm">
                            <span class="text-green-800 text-sm font-medium">{{ successMessage }}</span>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    
        <div class="w-full lg:w-1/3 flex flex-col gap-6">
            <div class="bg-white shadow-lg rounded-md p-6 border-yellow-500 border-l-4">
                <div class="flex flex-row items-center justify-center mb-3 bg-sky-400 p-2 rounded-md shadow-sm">
                    <span class="text-lg text-sky-800 font-bold tracking-wider">Tool Ricerca Aeroporti</span>
                </div>
                
                <form [formGroup]="AirportForm" (ngSubmit)="searchAirports()">
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Codice</label>
                            <input type="text" formControlName="code" placeholder="Es. JFK" 
                                class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Nome</label>
                            <input type="text" formControlName="name" placeholder="Es. LIN" 
                                class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Città</label>
                            <input type="text" formControlName="city" placeholder="Es. Milano"
                                class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Paese</label>
                            <input type="text" formControlName="country" placeholder="Es. Italia" 
                                class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                        </div>
                    </div>
                    
                    <div class="flex justify-end">
                        <button type="submit" 
                            class="w-full px-6 py-3 bg-yellow-500 hover:bg-yellow-600 text-white font-bold rounded-md shadow-md transition-all disabled:opacity-50 text-base whitespace-nowrap">
                            Cerca Aeroporti
                        </button>
                    </div>
                
                    <div *ngIf="errorMessageAirport" class="mt-4">
                        <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded shadow-sm flex items-center justify-between">
                            <span class="text-red-800 text-sm font-medium">{{ errorMessageAirport }}</span>
                            <button type="button" (click)="errorMessageAirport = null" class="text-red-500 hover:text-red-700 text-xl font-bold">
                                &times;
                            </button>
                        </div>
                    </div>
                    
                    <div *ngIf="successMessageAirport" class="mt-4">
                        <div class="bg-green-50 border-l-4 border-green-500 p-4 rounded shadow-sm">
                            <span class="text-green-800 text-sm font-medium">{{ successMessageAirport }}</span>
                        </div>
                    </div>
                </form>
            </div>

            <ng-container *ngIf="this.airports.length > 0">
                <div class="flex flex-col gap-4 w-full">
                    <div *ngFor="let airport of airports" >
                        <div class="bg-white shadow-2xl border border-solid border-yellow-500 border-l-4 rounded-md p-4 mb-6"> 
                            <div class="flex flex-col items-start mb-3 bg-sky-400 p-2 rounded-md shadow-sm">
                                <div class="flex flex-row gap-4 p-1 items-center justify-start">
                                    <span class="text-xs text-gray-500 font-bold uppercase">
                                        Cod
                                    </span>
                                    <span class="text-sm font-extrabold text-slate-800">
                                        {{ airport.code }}
                                    </span>
                                </div>

                            </div>

                            <div class="flex flex-col gap-4">
                                <div>
                                    <div class="text-lg font-bold text-black leading-none">{{ airport.name }}</div>
                                    <div class="text-sm text-gray-500">{{ airport.city }}</div>
                                    <div class="text-xs text-sky-600 font-mono">{{ airport.country }}</div>
                                </div>
                            </div>
                        </div>  
                </div>
                </div> 
            </ng-container>
        </div>
    </div>
</div>
