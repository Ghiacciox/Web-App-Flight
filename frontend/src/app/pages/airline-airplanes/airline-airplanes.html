<div class="min-h-screen flex flex-col bg-gray-100">
    
   <nav class="bg-sky-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex-shrink-0 font-bold text-2xl tracking-widder cursor-pointer" routerLink="/home">
                    Bau<span class="text-yellow-500">Flights</span>
                </div>

                <div class="flex items-center space-x-6">

                    <ng-container *ngIf="!this.http.isAuthenticated()">
                        <a routerLink="/login" class="hover:text-yellow-500 transition-colors"> login</a>
                    </ng-container>
                    
                    <ng-container *ngIf="this.http.isAuthenticated() && this.http.is_passenger()">
                        <a routerLink="/bookingPrenotation" class="over:text-yellow-500 transition-colors"> Prenotazioni</a>
                    </ng-container>

                    <ng-container *ngIf="this.http.isAuthenticated() && this.http.is_passenger()">
                        <a routerLink="/login" class="hover:text-yellow-500 transition-colors"> Profilo</a>
                        <a routerLink="/bookingPrenotation" class="over:text-yellow-500 transition-colors"> Prenotazioni</a>
                    </ng-container>

                    <!--capisco se togliere sec me meglio nel profilo-->
                    <ng-container *ngIf="this.http.isAuthenticated()">
                        <a (click)="this.http.logout()" class="hover:text-yellow-500 transition-colors"> logout</a>
                    </ng-container>
                
                </div> </div>
        </div>
    </nav>
    <!--fine della navbar -->


    <div class="flex-grow flex flex-col lg:flex-row gap-6 bg-sky-400 items-start justify-center p-4 md:p-8">

        <div class="flex-1 flex flex-col gap-8">

            <div class="bg-white shadow-lg rounded-md p-6 border-yellow-500 border-l-4 w-full flex flex-col justify-center">
                <div class="flex flex-row items-center justify-center mb-3 bg-sky-400 p-2 rounded-md shadow-sm">
                    <span class="text-lg text-sky-800 font-bold tracking-wider mb-0.5">Tool Creazione Aerei</span>
                </div>
                <form [formGroup]="AirplaneForm" (ngSubmit)="onclickCreateAirplane()" class="w-full">    
                    <div class="flex flex-col items-end gap-4">
                            <div class="w-full md:flex-1">
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Nome modello</label>
                                <input id="model" type="text" formControlName="model" placeholder="Es. Boeing 737" 
                                    class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                            </div>

                            <div class="flex flex-row gap-6 w-full">

                                <div>
                                    <span class="text-lg text-sky-800 font-bold tracking-wider mb-0.5">Configurazione posti Economy</span>
                                        
                                    <div class="w-full md:flex-1">
                                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Righe</label>
                                        <input id="economyRows" type="text" formControlName="economyRows" placeholder="Es. Malpensa " 
                                        class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                                    </div>

                                    <div class="w-full md:flex-1">
                                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Posti per riga</label>
                                        <input id="economySeatsPerRow" type="text" formControlName="economySeatsPerRow" placeholder="Es. Malpensa " 
                                        class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                                    </div>
                                </div>

                                <div>
                                    <span class="text-lg text-sky-800 font-bold tracking-wider mb-0.5">Configurazione posti Business</span>
                                        
                                    <div class="w-full md:flex-1">
                                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Righe</label>
                                        <input id="businessRows" type="text" formControlName="businessRows" placeholder="Es. Malpensa " 
                                        class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                                    </div>

                                    <div class="w-full md:flex-1">
                                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Posti per riga</label>
                                        <input id="businessSeatsPerRow" type="text" formControlName="businessSeatsPerRow" placeholder="Es. Malpensa " 
                                        class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                                    </div>
                                </div>


                               <div>
                                    <span class="text-lg text-sky-800 font-bold tracking-wider mb-0.5">Configurazione posti PrimaClasse</span>
                                        
                                    <div class="w-full md:flex-1">
                                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Righe</label>
                                        <input id="firstClassRows" type="text" formControlName="firstClassRows" placeholder="Es. Malpensa " 
                                        class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                                    </div>

                                    <div class="w-full md:flex-1">
                                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Posti per riga</label>
                                        <input id="firstClassSeatsPerRow" type="text" formControlName="firstClassSeatsPerRow" placeholder="Es. Malpensa " 
                                        class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                                    </div>
                               </div>

                            </div>

                            <button type="submit" [disabled]="AirplaneForm.invalid"
                                class="w-full px-6 py-3 bg-yellow-500 hover:bg-yellow-600 text-white font-bold rounded-md shadow-md transition-all disabled:opacity-50 text-base whitespace-nowrap">
                                Crea
                            </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="w-full lg:w-1/3 flex flex-col gap-6">

            <div class="bg-white shadow-lg rounded-md gap-4 p-6 border-yellow-500 border-l-4 w-full flex flex-col justify-center">
                <div class="flex flex-row items-center justify-center bg-sky-400 p-2 rounded-md shadow-sm">
                    <span class="text-lg text-sky-800 font-bold tracking-wider">Tool ricerca Aerei</span>
                </div>
                <div class="w-full md:flex-1">
                        <label class="block text-xs font-bold text-gray-500 uppercase">Nome modello</label>
                        <input type="text" [(ngModel)]="airplaneModelSearch" placeholder="Es. Boeing 737" 
                            class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all"/>
                </div>
                <button type="button" (click)="searchAirplane()" 
                    class="w-full md:w-auto px-6 py-3 bg-yellow-500 hover:bg-yellow-600 text-white font-bold rounded-md shadow-md transition-all disabled:opacity-50 text-sm whitespace-nowrap">
                    Cerca
                </button>
            </div>


            <ng-container *ngIf="this.airplanes.length > 0">
                    <div class="flex flex-col justify-center items-center gap-6 w-full mx-auto p-4">
                        <div *ngFor="let airplane of airplanes" >
                            <div class="bg-white shadow-2xl border border-solid border-yellow-500 border-l-4 rounded-md p-4 "> 
                                <div class="flex flex-col items-start mb-3 bg-sky-400 p-2 rounded-md shadow-sm">
                                    <div class="flex flex-row gap-4 p-1 items-center justify-start">
                                        <span class="text-sm text-sky-800 font-bold tracking-wider mb-0.5">
                                            Nome modello: {{ airplane.airplaneModel }}
                                        </span>
                                    </div>

                                </div>

                                <div class="flex flex-col gap-4 justify-center items-center">
                                <!-- vorrei dichiarare qua una variabuile che tiene la classe scelta e nn usare select class-->
                                    <div class="flex flex-row justify-center gap-4 p-4 px-2 w-full">
                                        <button type="button" 
                                            (click)="airplane.selectedClass = 'economy'" 
                                            [class.bg-yellow-400]="airplane.selectedClass === 'economy'"
                                            [class.ring-sky-500]="airplane.selectedClass === 'economy'"
                                            class="p-4 rounded-lg border border-gray-200 hover:border-sky-300 transition-all text-left flex justify-between items-center group block text-xs font-bold text-sky-600  uppercase mb-1" >
                                            Economy
                                        </button>
                                
                                        <button type="button" 
                                            (click)="airplane.selectedClass = 'business'" 
                                            [class.bg-yellow-400]="airplane.selectedClass === 'business'"
                                            [class.ring-sky-500]="airplane.selectedClass === 'business'"
                                            class="p-4 rounded-lg border border-gray-200 hover:border-sky-300 transition-all text-left flex justify-between items-center group block text-xs font-bold text-sky-600  uppercase mb-1" >
                                            Business
                                        </button>
                                
                                        <button type="button" 
                                            (click)="airplane.selectedClass = 'firstclass'" 
                                            [class.bg-yellow-400]="airplane.selectedClass === 'firstclass'"
                                            [class.ring-sky-500]="airplane.selectedClass === 'firstclass'"
                                            class="p-4 rounded-lg border border-gray-200 hover:border-sky-300 transition-all text-left flex justify-between items-center group block text-xs font-bold text-sky-600  uppercase mb-1" >
                                            Firstclass
                                        </button>
                                    </div>

                                   <ng-container *ngIf="this.bookingService.generateSeats(airplane, airplane.selectedClass || '') as allSeats">

                                    <div class="flex-row items-center justify-center">

                                        <div class="grid gap-3 justify-center justify-items-center mt-2 mx-auto w-fit"
                                            [style.grid-template-columns]="'repeat(' + this.bookingService.getColumns(airplane, airplane.selectedClass || '') + ', min-content)'">
                                            
                                            <div *ngFor="let seat of allSeats; let i = index"
                                                [style.margin-right]="bookingService.seatsGap(i, airplane, airplane.selectedClass || '') ? '40px' : '0'"
                                                class="w-10 h-10 rounded-lg border-2 border-gray-300 flex justify-center items-center font-bold text-sm hover:border-sky-500 cursor-pointer transition-all bg-white">
                                                {{ seat }}
                                            </div>

                                        </div>

                                        <div *ngIf="allSeats.length === 0" class="text-gray-400 text-center mt-4 text-sm italic">
                                            Nessuna configurazione sedili trovata.
                                        </div>

                                    </div>
                                    </ng-container>
                                </div>
                            </div>  
                    </div>
                    </div> 
                </ng-container>

        </div>
</div>
