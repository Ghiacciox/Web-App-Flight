<div class="min-h-screen flex flex-col bg-gray-100">
    
<nav class="bg-sky-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex-shrink-0 font-bold text-2xl tracking-wider cursor-pointer" routerLink="/home">
                    Bau<span class="text-yellow-500">Flights</span>
                </div>

                <div class="flex items-center space-x-6">
                    <ng-container *ngIf="!this.http.isAuthenticated()">
                        <a routerLink="/login" class="hover:text-yellow-500 transition-colors"> login</a>
                    </ng-container>
                    
                    <ng-container *ngIf="this.http.isAuthenticated() && this.http.is_passenger()">
                        <a routerLink="/login" class="hover:text-yellow-500 transition-colors"> Profilo</a>
                        <a routerLink="/bookingPrenotation" class="hover:text-yellow-500 transition-colors"> Prenotazioni</a>
                    </ng-container>

                    <ng-container *ngIf="this.http.isAuthenticated()">
                        <a (click)="this.http.logout()" class="hover:text-yellow-500 transition-colors"> logout</a>
                    </ng-container>
                </div>
            </div>
        </div>
    </nav>
    <!--fine della navbar -->


    <div class="flex-grow flex flex-col lg:flex-row gap-6 bg-sky-400 items-start justify-center p-4 md:p-8">

        <div class="flex-1 flex flex-col gap-8">
            <div class="bg-white shadow-lg rounded-md p-6 border-yellow-500 border-l-4 w-full flex flex-col justify-center">
                
                <div class="bg-sky-400 p-2 gap-6 shadow-sm">
                    <span class="text-lg text-sky-800 font-bold tracking-wider mb-0.5">Tool Creazione voli</span>
                </div>

                <form [formGroup]="FlightForm" (ngSubmit)="onclickCreateFlight()" class="w-full flex flex-col gap-6">    
                      
                    <div class="grid grid-cols-2 gap-6">
                     
                        <div class="flex flex-col">
                            <span class="text-lg text-sky-800 font-bold tracking-wider mb-2">Codice Volo</span>
                            <div class="w-full">
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Codice</label>
                                <input id="flightCode" type="text" formControlName="flightNumber" placeholder="Es. AZ123" 
                                    class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                            </div>
                        </div>
                        

                        <div class="flex flex-col">
                            <span class="text-lg text-sky-800 font-bold tracking-wider mb-0.5"> Modello Aereo</span>     
                                <div class="w-full md:flex-1">
                                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Modello</label>
                                    <input id="airplaneId" type="text" formControlName="airplaneId" placeholder="Es. Airbus A320" 
                                    class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                                </div>
                        </div>
                        
                    </div>
                    
                            
                    <div class="flex flex-col">
                        <span class="text-lg text-sky-800 font-bold tracking-wider mb-0.5">Tratta</span>

                        <div class="flex flex-row gap-4">
                            <div class="w-full md:flex-1">
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">From</label>
                                <input id="from" type="text" formControlName="from" placeholder="Es. Malpensa " 
                                class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                            </div>

                            <div class="w-full md:flex-1">
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">To</label>
                                <input id="to" type="text" formControlName="to" placeholder="Es. Roma Fiumicino " 
                                class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                            </div>
                        </div>
                    </div>


                    <div class="flex flex-col">
                        <span class="text-lg text-sky-800 font-bold tracking-wider mb-0.5">Configurazione prezzi biglietti ed extra</span>
                        <div class="flex flex-row gap-4">
                            <div class="w-full md:flex-1">
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Economy</label>
                                <input id="economyPrice" type="number" formControlName="economyPrice" placeholder="Es. 100 €" 
                                class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                            </div>

                            <div class="w-full md:flex-1">
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Business</label>
                                <input id="businessPrice" type="number" formControlName="businessPrice" placeholder="Es. 200 €" 
                                class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                            </div>

                            <div class="w-full md:flex-1">
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Firstclass</label>
                                <input id="firstClassPrice" type="number" formControlName="firstClassPrice" placeholder="Es. 300 €" 
                                class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                            </div>
                        </div>  
                        
                        <div class="flex flex-row gap-4">
                            <div class="w-full md:flex-1">
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Extra Legroom</label>
                                <input id="legroom" type="number" formControlName="legroom" placeholder="Es. 300 €" 
                                class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                            </div>

                            <div class="w-full md:flex-1">
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Extra Baggage</label>
                                <input id="baggage" type="number" formControlName="baggage" placeholder="Es. 300 €" 
                                class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                            </div>
                            
                            <div class="w-full md:flex-1">
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Priority Boarding</label>
                                <input id="priorityBoarding" type="number" formControlName="priorityBoarding" placeholder="Es. 300 €" 
                                class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col">
                        <span class="text-lg text-sky-800 font-bold tracking-wider mb-0.5">Date Aereo</span>
                        
                        <div class="flex flex-row gap-4">
                            <div class="w-full md:flex-1">
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Orario di partenza</label>
                                <input id="departureTime" type="time" formControlName="departureTime" placeholder="Es. Malpensa " 
                                class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                            </div>

                            <div class="w-full md:flex-1">
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Data di partenza</label>
                                <input id="departureDate" type="date" formControlName="departureDate" placeholder="Es. Malpensa " 
                                class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                            </div>

                            <div class="w-full md:flex-1">
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Orario di arrivo</label>
                                <input id="arrivalTime" type="time" formControlName="arrivalTime" placeholder="Es. Malpensa " 
                                class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                            </div>

                            <div class="w-full md:flex-1">
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Data di arrivo</label>
                                <input id="arrivalDate" type="date" formControlName="arrivalDate" placeholder="Es. Malpensa " 
                                class="w-full px-4 py-3 rounded-md bg-gray-50 border border-slate-300 focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all" />
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col gap-2 transition-all duration-300">
                        
                        <div *ngIf="errorMessage" 
                            class="bg-red-50 border-l-4 border-red-500 p-4 rounded shadow-sm flex items-center justify-between">
                            <div class="flex items-center">
                                <span class="text-red-800 text-sm font-medium">{{ errorMessage }}</span>
                            </div>
                            <button type="button" (click)="errorMessage = null" class="text-red-500 hover:text-red-700 text-xl font-bold">
                                &times;
                            </button>
                        </div>

                        <div *ngIf="successMessage" 
                            class="bg-green-50 border-l-4 border-green-500 p-4 rounded shadow-sm">
                            <span class="text-green-800 text-sm font-medium">{{ successMessage }}</span>
                        </div>
                    </div>


        
                    <button type="submit" [disabled]="FlightForm.invalid"
                        class="w-full px-6 py-3 bg-yellow-500 hover:bg-yellow-600 text-white font-bold rounded-md shadow-md transition-all disabled:opacity-50 text-base whitespace-nowrap">
                        Crea volo
                    </button>
                </form>
            </div>
        </div>
</div>
